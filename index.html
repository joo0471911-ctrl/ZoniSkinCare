<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C2185B">
<meta name="description" content="Zoni Skin Care. Face creams, serums, face wash, hair removal and more. Order on WhatsApp. Delivery all over Bangladesh.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Zoni Skin Care</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=DM+Sans:wght@400;500;600&family=Noto+Sans+Bengali:wght@400;600&display=swap">
<style>
/* Layout: fluid column up to 1180px. Header with brand, small WhatsApp and Facebook icons, desktop nav. Featured row (swipe on phones, four across on desktop), search, category chips, product grid, payment-aware order sheet. Bottom tab bar on phones only. */
:root {
  --bg: #FFF5F8;
  --surface: #FFFFFF;
  --ink: #2A1620;
  --muted: #7A5A68;
  --line: #F0D9E1;
  --accent: #C2185B;
  --accent-ink: #FFFFFF;
  --soft: #FCE4EC;
  --gold: #A9792B;
  --shadow: 0 -12px 40px rgba(42, 22, 32, 0.2);
  --f-display: 'Playfair Display', Georgia, 'Noto Sans Bengali', serif;
  --f-body: 'DM Sans', 'Noto Sans Bengali', 'Segoe UI', system-ui, sans-serif;
  --gap: clamp(10px, 1.6vw, 20px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1B1015; --surface: #26161D; --ink: #FBEFF3; --muted: #D1A9B8; --line: #40262F;
    --accent: #F26BA2; --accent-ink: #2A0D18; --soft: #34202A; --gold: #D9B26A;
    --shadow: 0 -12px 40px rgba(0, 0, 0, 0.55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1B1015; --surface: #26161D; --ink: #FBEFF3; --muted: #D1A9B8; --line: #40262F;
  --accent: #F26BA2; --accent-ink: #2A0D18; --soft: #34202A; --gold: #D9B26A;
  --shadow: 0 -12px 40px rgba(0, 0, 0, 0.55);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 96px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1180px; margin: 0 auto; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 12px 10px; display: flex; align-items: center; gap: 14px; }
.brand { flex: 1; margin: 0; }
.brandbtn { display: flex; align-items: center; gap: 10px; border: 0; background: none; padding: 0; text-align: left; }
.logo { width: 46px; height: 46px; border-radius: 50%; flex: none; display: block; }
.bname { font-family: var(--f-display); font-weight: 700; font-size: 24px; letter-spacing: -0.01em; line-height: 1; }
.bname small { display: block; font-family: var(--f-body); font-weight: 600; font-size: 10px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--gold); margin-top: 4px; }

.nav { display: none; gap: 6px; }
.navbtn { border: 0; background: none; padding: 8px 14px; border-radius: 999px; font-weight: 600; color: var(--muted); position: relative; }
.navbtn[aria-current="page"] { background: var(--soft); color: var(--accent); }
.navbtn .dot { position: static; display: inline-grid; margin-left: 6px; vertical-align: 1px; }
.social { display: flex; gap: 8px; flex: 1; justify-content: flex-end; }
.sbtn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--accent); display: grid; place-items: center; text-decoration: none; }
.sbtn svg { width: 19px; height: 19px; }
.sbtn:hover { background: var(--soft); }

/* home */
.hero { padding-block: 8px 6px; }
.hero2 { display: grid; gap: 24px; padding: clamp(20px, 4vw, 52px); border-radius: 28px; background: linear-gradient(120deg, var(--soft) 0%, var(--bg) 100%); border: 1px solid var(--line); margin-top: 6px; }
.eyebrow { font-weight: 600; letter-spacing: 0.03em; color: var(--accent); font-size: 14px; }
.lead { font-family: var(--f-display); font-size: clamp(36px, 5.6vw, 66px); line-height: 1.03; letter-spacing: -0.02em; margin: 8px 0 14px; text-wrap: balance; }
.lead em { color: var(--accent); font-style: italic; font-weight: 600; }
.cta-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
.btn { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 14px 26px; font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; gap: 8px; }
.ghost.pill { border-radius: 999px; padding: 13px 22px; }
.trust { list-style: none; margin: 22px 0 0; padding: 0; display: grid; gap: 10px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.trust li { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.trust svg { width: 26px; height: 26px; color: var(--accent); flex: none; }
.trust b { font-size: 12.5px; line-height: 1.25; font-weight: 600; }
@media (min-width: 640px) { .trust li { flex-direction: row; text-align: left; gap: 10px; } .trust b { font-size: 14px; } }
.hvis { display: grid; grid-template-columns: 1fr 1.15fr 1fr; gap: clamp(8px, 1.4vw, 16px); align-items: center; }
.hv { border: 0; padding: 0; background: var(--surface); border-radius: 20px; overflow: hidden; aspect-ratio: 3 / 4; box-shadow: 0 10px 30px rgba(194, 24, 91, 0.14); }
.hv:nth-child(2) { aspect-ratio: 3 / 4.3; }
.hv img { width: 100%; height: 100%; object-fit: cover; display: block; }
.block { margin-top: clamp(30px, 5vw, 60px); }
.cats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--gap); }
.cat-tile { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 10px 10px 14px; display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; }
.cat-tile:hover { border-color: var(--accent); }
.cat-tile img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; border-radius: 14px; margin-bottom: 8px; display: block; }
.cat-tile b { font-weight: 600; }
.cat-tile small { color: var(--muted); font-size: 13px; }
.promo { display: block; width: 100%; padding: 0; border: 0; border-radius: 22px; overflow: hidden; background: var(--soft); }
.promo img { width: 100%; height: auto; display: block; }
section[id] { scroll-margin-top: 84px; }
.foot2 { margin-top: clamp(36px, 6vw, 64px); background: var(--soft); border-radius: 28px; padding: clamp(30px, 5vw, 56px) 20px; text-align: center; color: var(--muted); font-size: 13px; display: flex; flex-direction: column; align-items: center; gap: 20px; }
.flogo { width: 88px; height: 88px; border-radius: 50%; display: block; }
.fname { font-family: var(--f-display); font-size: 24px; font-weight: 700; color: var(--ink); line-height: 1.1; }
.ftag { margin-top: -12px; }
.flinks { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.fl { border: 0; background: none; padding: 2px 0; font-size: 11.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink); text-decoration: none; }
.fl:hover { color: var(--accent); }
.fsoc { display: flex; gap: 12px; }
.fsq { width: 46px; height: 46px; display: grid; place-items: center; color: var(--ink); text-decoration: none; border: 1px solid color-mix(in srgb, var(--muted) 45%, transparent); background: transparent; }
.fsq:hover { background: var(--surface); color: var(--accent); }
.fsq svg { width: 20px; height: 20px; }
.fphone { display: inline-flex; align-items: center; gap: 8px; color: var(--ink); font-weight: 600; font-size: 15px; text-decoration: none; }
.fphone svg { width: 17px; height: 17px; color: var(--accent); }
.stores { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.store { display: flex; align-items: center; gap: 10px; background: #111; color: #fff; border: 1px solid #555; border-radius: 12px; padding: 8px 18px 8px 12px; text-align: left; text-decoration: none; min-width: 160px; }
.store svg, .store img { width: 28px; height: 28px; flex: none; }
.store small { display: block; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.8; }
.store b { display: block; font-size: 16px; line-height: 1.15; font-weight: 600; }
.store:disabled { opacity: 0.7; cursor: not-allowed; }
.cr { margin: 0; font-size: 11.5px; letter-spacing: 0.1em; text-transform: uppercase; }
.pays { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.pay img { height: 30px; width: auto; max-width: none; flex: none; display: block; }
.pay.plogo { padding: 0 12px; height: 44px; flex: none; }
.pay { background: #fff; border: 1px solid rgba(0, 0, 0, 0.08); border-radius: 10px; height: 38px; padding: 0 14px; display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 15px; letter-spacing: -0.01em; }
.pay svg { width: 20px; height: 20px; }
.pay.bkash { color: #E2136E; font-style: italic; }
.pay.nagad { color: #E8590C; }
.pay.rocket { color: #8C3494; }
.pay.bank { color: #1565C0; }
.pay.cardpay { color: #37474F; }
.fnote { margin: 0; font-size: 12px; }
.allb { border-radius: 28px; padding: clamp(20px, 3.5vw, 40px); background: linear-gradient(115deg, #7D0F47 0%, #C2185B 58%, #D9567F 100%); color: #fff; overflow: hidden; }
.allb-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px 24px; }
.allb-t { display: flex; align-items: center; gap: 16px; min-width: 0; }
.allb-logo { width: 64px; height: 64px; border-radius: 50%; flex: none; border: 2px solid rgba(255, 255, 255, 0.5); }
.allb-eye { font-size: 12.5px; letter-spacing: 0.12em; text-transform: uppercase; color: #F6D9A8; font-weight: 600; }
.allb h2 { font-family: var(--f-display); font-size: clamp(24px, 3.4vw, 40px); line-height: 1.1; letter-spacing: -0.01em; margin: 4px 0 0; text-wrap: balance; }
.allb h2 em { color: #F6D9A8; font-style: italic; }
.btn.gold { background: #F6D9A8; color: #4A1030; }
.marq { margin-top: 22px; overflow: hidden; -webkit-mask-image: linear-gradient(90deg, transparent, #000 5%, #000 95%, transparent); mask-image: linear-gradient(90deg, transparent, #000 5%, #000 95%, transparent); }
.track { display: flex; gap: 12px; width: max-content; animation: slide 70s linear infinite; }
.marq:hover .track, .marq:focus-within .track { animation-play-state: paused; }
@keyframes slide { to { transform: translateX(calc(-50% - 6px)); } }
.mt { flex: none; width: clamp(104px, 13vw, 148px); aspect-ratio: 4 / 5; padding: 0; border: 2px solid rgba(255, 255, 255, 0.4); border-radius: 16px; overflow: hidden; background: #fff; }
.mt img { width: 100%; height: 100%; object-fit: cover; display: block; }
@media (prefers-reduced-motion: reduce) { .track { animation: none; } .marq { overflow-x: auto; } }
.sub { color: var(--muted); margin: 0 0 18px; max-width: 46ch; font-size: 16px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 14px 0 10px; }
.sec-head h2 { font-family: var(--f-display); font-size: clamp(20px, 2.4vw, 28px); letter-spacing: -0.01em; margin: 0; }
.sec-head span { color: var(--muted); font-size: 13.5px; }
.feat-row { display: flex; gap: var(--gap); overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 8px; scrollbar-width: none; }
.feat-row::-webkit-scrollbar { display: none; }
.fcard { flex: 0 0 min(64%, 250px); scroll-snap-align: start; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.fopen { border: 0; background: none; padding: 0; text-align: left; display: flex; flex-direction: column; flex: 1; }
.fcard .info { padding: 12px 14px 8px; }
.mini { margin: 4px 14px 14px; border: 1px solid var(--accent); background: none; color: var(--accent); border-radius: 12px; padding: 9px 12px; font-weight: 600; }
.mini:hover { background: var(--accent); color: var(--accent-ink); }

.search { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; max-width: 560px; display: block; }
.search::placeholder { color: var(--muted); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 6px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: var(--gap); margin-top: 14px; }
.card { text-align: left; padding: 0; background: var(--surface); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; border: 1px solid var(--line); }
.card:hover, .fcard:hover { border-color: var(--accent); }
.ph { background: var(--soft); aspect-ratio: 4 / 5; position: relative; overflow: hidden; }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.badge { position: absolute; top: 8px; left: 8px; background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 999px; }
.info { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 2px; flex: 1; }
.cat { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gold); font-weight: 600; }
.name { font-weight: 600; line-height: 1.25; }
.meta { color: var(--muted); font-size: 13px; }
.empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 36px 0; }
.recs { grid-column: 1 / -1; font-family: var(--f-display); font-size: 20px; letter-spacing: -0.01em; margin: 14px 0 0; }
.price { margin-top: auto; padding-top: 6px; font-variant-numeric: tabular-nums; }
.price b { font-weight: 600; }
.price s { color: var(--muted); font-size: 13px; margin-left: 6px; }
.price.ask { color: var(--muted); font-size: 13px; }
.pbox { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 6px 0 4px; font-variant-numeric: tabular-nums; }
.pbox strong { font-family: var(--f-body); font-weight: 700; font-size: 26px; color: var(--accent); }
.pbox s { color: var(--muted); }
.pbox span { background: var(--soft); color: var(--accent); font-size: 12.5px; font-weight: 600; border-radius: 999px; padding: 2px 10px; }

.foot { margin-top: 32px; padding-block: 22px 8px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; display: grid; gap: 6px; }
.foot b { color: var(--ink); }

/* order page */
h2.screen { font-family: var(--f-display); font-size: clamp(26px, 3vw, 36px); letter-spacing: -0.02em; margin: 8px 0 12px; }
.hint { background: var(--soft); border-radius: 12px; padding: 10px 12px; font-size: 13.5px; color: var(--muted); margin: 0 0 8px; }
.cartgrid { display: grid; gap: 18px; align-items: start; }
.line { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.line .ph { aspect-ratio: 1 / 1; border-radius: 12px; }
.line .name { font-size: 14.5px; }
.qty { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); margin-top: 6px; }
.qty button { width: 32px; height: 32px; border: 0; background: none; font-size: 18px; line-height: 1; }
.qty output { min-width: 22px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; }
.summary { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 12px; }
.total { display: flex; justify-content: space-between; align-items: baseline; font-variant-numeric: tabular-nums; }
.total strong { font-size: 20px; }
.summary .small { margin: 0; font-size: 13px; color: var(--muted); }

.primary { width: 100%; border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 14px; padding: 15px 18px; font-weight: 600; font-size: 16px; display: flex; justify-content: center; align-items: center; gap: 10px; text-decoration: none; text-align: center; }
.primary svg { width: 20px; height: 20px; }
a.primary { color: var(--accent-ink); }
.ghost { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 13px 18px; font-weight: 600; text-decoration: none; color: var(--ink); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.ghost svg { width: 19px; height: 19px; color: var(--accent); }

/* bottom tab bar, phones only */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.tabs div { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tab { border: 0; background: none; padding: 8px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12.5px; color: var(--muted); position: relative; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--accent); font-weight: 600; background: var(--soft); }
.dot { position: absolute; top: 2px; left: calc(50% + 6px); min-width: 18px; height: 18px; border-radius: 99px; background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 600; display: grid; place-items: center; padding: 0 5px; }

/* sheet: bottom sheet on phones, centred dialog on larger screens */
.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(20, 8, 14, 0.55); display: flex; align-items: flex-end; justify-content: center; }
.sheet { position: relative; width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto; background: var(--surface); border-radius: 24px 24px 0 0; box-shadow: var(--shadow); padding: 18px max(18px, env(safe-area-inset-right, 0px)) 0 max(18px, env(safe-area-inset-left, 0px)); animation: up 0.22s ease-out; }
@keyframes up { from { transform: translateY(24px); opacity: 0.6; } to { transform: none; opacity: 1; } }
.closebar { position: sticky; top: 8px; height: 0; z-index: 3; }
.sheet .close { position: absolute; top: 0; right: 0; z-index: 2; border: 1px solid var(--line); background: var(--surface); width: 36px; height: 36px; border-radius: 50%; font-size: 20px; line-height: 1; }
.pcols { display: grid; gap: 14px; }
.sheet .hero { background: var(--soft); border-radius: 18px; height: 260px; overflow: hidden; }
.sheet .hero img { width: 100%; height: 100%; object-fit: contain; display: block; }
.thumbs { display: flex; gap: 8px; margin-top: 10px; }
.thumb { width: 56px; height: 70px; padding: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--soft); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.sheet h3 { font-family: var(--f-display); font-size: 24px; letter-spacing: -0.02em; margin: 2px 0 4px; line-height: 1.15; }
.sheet p { margin: 8px 0; }
.sheet .bn { color: var(--muted); font-size: 14.5px; margin: 0 0 6px; }
.label { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 14px 0 6px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tags span { background: var(--soft); border-radius: 999px; font-size: 13px; padding: 3px 10px; }
.size { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 14px; }
.pricelink { margin-top: 14px; }
.buy { position: sticky; bottom: 0; background: var(--surface); display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: center; margin-top: 16px; padding: 12px 0 calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); }
.buy .qty { margin: 0; }
.poster { width: 100%; height: auto; border-radius: 14px; display: block; border: 1px solid var(--line); }
.end { height: calc(20px + env(safe-area-inset-bottom, 0px)); }

/* checkout form and payment methods */
.form { display: grid; gap: 12px; margin-top: 10px; }
.form label.f { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.form input[type="text"], .form input[type="tel"], .form textarea { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 12px 14px; color: var(--ink); font-size: 16px; }
.form textarea { min-height: 84px; resize: vertical; }
.form .fine { font-size: 13px; color: var(--muted); margin: 0; }
.form .err { color: var(--accent); font-weight: 600; }
.pms { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
.pm { display: flex; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--bg); cursor: pointer; }
.pm input { accent-color: var(--accent); margin: 0; flex: none; }
.pm:has(input:checked) { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.pm i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.pm img { width: 44px; height: 32px; object-fit: contain; flex: none; background: #fff; border-radius: 8px; padding: 3px; border: 1px solid var(--line); }
.pm b { font-weight: 600; }
.pm small { display: block; color: var(--muted); font-size: 12.5px; line-height: 1.3; }
.payinfo { background: var(--soft); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
.payinfo b { color: var(--accent); user-select: all; }
.copy { border: 1px solid var(--accent); background: var(--surface); color: var(--accent); border-radius: 999px; padding: 2px 12px; font-size: 13px; font-weight: 600; margin-left: 6px; }
.payact { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 2px; }
.openapp { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 999px; font-weight: 700; font-size: 14px; color: #fff; text-decoration: none; }
.openapp img { width: 22px; height: 22px; object-fit: contain; background: #fff; border-radius: 6px; padding: 2px; }
.qrbox { display: flex; align-items: center; gap: 14px; margin-top: 12px; padding: 12px; border-radius: 12px; background: #fff; color: #222; border: 1px solid var(--line); }
.qrbox svg { width: 120px; height: 120px; flex: none; display: block; }
.qrbox small { display: block; color: #555; font-size: 12.5px; line-height: 1.4; }
.qrbox b { color: #222; user-select: all; }
.doneBox { max-width: 520px; margin: 40px auto 28px; text-align: center; display: grid; gap: 12px; justify-items: center; }
.doneBox p { margin: 0; }
.doneBox b { color: var(--accent); }
.tick { width: 64px; height: 64px; border-radius: 50%; background: #2E7D32; color: #fff; display: grid; place-items: center; font-size: 34px; }
.doneBtns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 6px; }
.copy:hover { background: var(--accent); color: var(--accent-ink); }


.toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 30; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px; max-width: calc(100% - 32px); }

@media (min-width: 760px) {
  .scrim { align-items: center; }
  .sheet { max-width: 940px; max-height: 90vh; border-radius: 24px; padding-inline: 26px; }

  .pcols { grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); gap: 26px; }
  .sheet .hero { height: 430px; }
  .sheet h3 { font-size: 28px; }
}
@media (min-width: 640px) { .cats { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (min-width: 900px) {

  .nav { display: flex; }

    var sh = $('sheet');
    if (S.sheet) {
      var keep = sh.firstChild ? sh.firstChild.scrollTop : 0;
      sh.hidden = false; sh.className = 'scrim';
      sh.innerHTML = '<div class="sheet' + (S.sheet.checkout ? ' narrow' : '') + '" role="dialog" aria-modal="true">' + sheet() + '</div>';
      if (S.sheet.keepScroll) sh.firstChild.scrollTop = keep;
    } else { sh.hidden = true; sh.innerHTML = ''; }
  }
  function toSection(id) {
    var el = $(id);
    if (!el || S.view !== 'shop') { S.view = 'shop'; S.sheet = null; if (!el) { S.cat = 'All'; S.q = ''; } draw(); el = $(id); }
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  function go(v) { S.view = v; S.sheet = null; draw(); window.scrollTo(0, 0); }
  function addToOrder(id, qty) {
    var hit = S.cart.filter(function (x) { return x.id === id; })[0];
    if (hit) hit.qty += qty; else S.cart.push({ id: id, qty: qty });
    persist();
  }

  function orderMessage() {
    var f = S.form, m = payById(S.pay);
    var lines = S.cart.map(function (x, i) { var p = byId(x.id); return (i + 1) + '. ' + p.n + ' (' + p.b + ') x ' + x.qty + (p.pr ? ' - BDT ' + p.pr * x.qty : ''); });
    var msg = 'Hello Zoni Skin Care, I would like to order.\nOrder No: ' + orderNo() + '\nDate: ' + new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) + '\n\n' + lines.join('\n');
    if (allPriced()) msg += '\n\nOrder total before delivery: BDT ' + cartTotal();
    msg += '\n\nPayment method: ' + m.n;
    if (m.wallet) {
      msg += '\nI have paid' + (allPriced() ? ' BDT ' + cartTotal() : '') + ' to ' + (m.num || (m.bank && m.bank.acc + ' (' + m.bank.name + ')'));
      msg += '\nTransaction ID: ' + f.trx.trim();
    }
    msg += '\n\nName: ' + f.name.trim() + '\nMobile: ' + f.phone.trim() + '\nAddress: ' + f.addr.trim();
    msg += m.wallet ? '\n\nPlease verify my payment and confirm my order.' : '\n\nPlease confirm the final amount including delivery.';
    return msg;
  }

  // Keep the WhatsApp button's link filled with the order text at all times, so the first tap already carries the message.
  function syncWa() {
    var a = $('wa-send'); if (!a) return;
    var f = S.form, ok = f.name.trim() && f.phone.trim() && f.addr.trim() && (!payById(S.pay).wallet || f.trx.trim());
    a.href = ok ? WA_CHAT + '?text=' + encodeURIComponent(orderMessage()) : WA_CHAT;
  }
  document.addEventListener('input', function (e) {
    var id = e.target.id;
    if (id === 'q') { S.q = e.target.value; $('grid').innerHTML = gridHtml(); }
    if (id === 'f-name') S.form.name = e.target.value;
    if (id === 'f-phone') S.form.phone = e.target.value;
    if (id === 'f-addr') S.form.addr = e.target.value;
    if (id === 'f-trx') S.form.trx = e.target.value;
    syncWa();
  });
  document.addEventListener('change', function (e) {
    if (e.target.name !== 'pay') return;
    S.pay = e.target.value;
    $('pay-info').innerHTML = payInfo(S.pay);
    $('trx-wrap').hidden = !payById(S.pay).wallet;
    $('wa-label').textContent = sendLabel(S.pay);
    $('f-err').hidden = true;
    syncWa();
  });
  document.addEventListener('click', function (e) {
    var oa = e.target.closest('a[data-openapp]');
    if (oa) {
      var num = payById(oa.dataset.openapp).num;
      try { navigator.clipboard.writeText(num).catch(function () {}); } catch (x) {}
      toast('Number copied. Paste it in Send Money.');
      if (!/Android/i.test(navigator.userAgent)) { e.preventDefault(); toast('Open the ' + payById(oa.dataset.openapp).n + ' app on your phone. Number copied.'); }
      return;
    }
    var el = e.target.closest('button, .scrim, #wa-send'); if (!el) return;
    if (el.id === 'wa-send') {
      var f = S.form;
      var err = $('f-err');
      if (!f.name.trim() || !f.phone.trim() || !f.addr.trim()) { e.preventDefault(); err.textContent = 'Please fill in your name, mobile number and address.'; err.hidden = false; return; }
      if (payById(S.pay).wallet && !f.trx.trim()) { e.preventDefault(); err.textContent = 'Please pay first, then enter the Transaction ID from your payment.'; err.hidden = false; $('f-trx').focus(); return; }
      err.hidden = true; $('f-hint').hidden = false;
      var text = orderMessage();
      el.href = WA_CHAT + '?text=' + encodeURIComponent(text);
      try { navigator.clipboard.writeText(text).catch(function () {}); } catch (x) {}
      setTimeout(finishOrder, 700);
      return;
    }
    var d = el.dataset;
    if (el.classList.contains('scrim') && e.target === el) { S.sheet = null; return draw(); }
    if (d.copy) {
      var copied = function () { toast('Number copied'); }, shown = function () { toast('Number: ' + d.copy); };
      try { navigator.clipboard.writeText(d.copy).then(copied, shown); } catch (x) { shown(); }
      return;
    }
    if (d.go) { if (d.home) { S.cat = 'All'; S.q = ''; } return go(d.go); }
    if (d.cat) { S.cat = d.cat; draw(); if (d.scroll) toSection(d.scroll); return; }
    if (d.scroll) return toSection(d.scroll);
    if (d.open) { S.sheet = { id: +d.open, qty: 1, img: 0 }; return draw(); }
    if (d.quick) { addToOrder(+d.quick, 1); draw(); return toast('Added to your order'); }
    if (d.img) { S.sheet.img = +d.img; S.sheet.keepScroll = true; return draw(); }
    if (d.sq) { S.sheet.qty = Math.max(1, Math.min(9, S.sheet.qty + +d.sq)); S.sheet.keepScroll = true; return draw(); }
    if (d.q) {
      var i = +d.q; S.cart[i].qty += +d.d;
      if (S.cart[i].qty < 1) S.cart.splice(i, 1);
      persist(); return draw();
    }
    switch (d.act) {
      case 'close': S.sheet = null; return draw();
      case 'add': addToOrder(S.sheet.id, S.sheet.qty); S.sheet = null; draw(); return toast('Added to your order');
      case 'checkout': S.sheet = { checkout: true }; return draw();
    }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && S.sheet) { S.sheet = null; draw(); } });
  draw();
})();
</script>
<script>
if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }
</script>
